@media (max-width: 600px) {

}

.divider {
 width: 90px;
height: 2px;
background: #FFCCCC;
margin: 60px auto;

    .map-btn {

   .gallery {

</head>

<div class="row two">

</div>

<div class="row one">

  <section>

  <footer>
    We are so glad to celebrate this moment with you.
  </footer>

  <!-- 倒數計算程式 -->
  <script>
    const weddingDate = new Date("2026-10-03");
    const countdownEl = document.getElementById("countdown");

    function updateCountdown() {
      const now = new Date();
      const diffTime = weddingDate - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays > 0) {
        countdownEl.innerHTML = `距離我們的重要日子，還有 <strong>${diffDays}</strong> 天`;
} else if (diffDays === 0) {
countdownEl.innerHTML = "It's the Day (*´∀`)~♥";
} else {
countdownEl.innerHTML = "我們已經幸福地走在一起了 🤍";
}
}
      
    updateCountdown();
  </script>
